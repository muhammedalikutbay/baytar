[workspace]
members = ["crates/baytar-core", "crates/baytar-cli", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/muhammedalikutbay/baytar"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Shared date/time support for clinical records and appointments.
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
# SHA-256 identity of legacy source files.
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
