repository.workspace = true
description = "Baytar veterinary patient records"

[lib]
name = "baytar_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
